name: release-nightly

on:
  push:
    branches: [main, release/dcs/v*]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  nightly-docker-rootful:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      GOPROXY: "https://proxy.golang.org,direct"
      GOSUMDB: "sum.golang.org"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      # fetch all commits instead of only the last as some branches are long lived and could have many between versions
      # fetch all tags to ensure that "git describe" reports expected DCS version, eg. v1.21.0+dcs-1-g1234567
      - run: git fetch --unshallow --quiet --tags --force
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          check-latest: true
          cache: true
          cache-dependency-path: go.sum
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Get cleaned branch name
        id: clean_name
        run: |
          REF_NAME=$(echo "$GITHUB_REF" | sed -e 's/refs\/heads\///' -e 's/refs\/tags\///' -e 's/release\/dcs\/v//' -e 's/-dcs$//')
          echo "branch=${REF_NAME}-nightly" >> "$GITHUB_OUTPUT"
      - name: Login to Docker Hub
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          username: ${{ secrets.DOCKER_BUILD_USERNAME }}
          password: ${{ secrets.DOCKER_BUILD_TOKEN }}
      - name: Download Go modules
        run: go mod download
      - name: fetch go modules
        run: make vendor
      - name: build rootful docker image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: unfoldingword/dcs:${{ steps.clean_name.outputs.branch }}
          build-args: |
            GOPROXY=https://proxy.golang.org,direct
